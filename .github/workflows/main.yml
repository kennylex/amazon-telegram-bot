```yaml
name: Monitor Amazon Pokémon

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amazon-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: .github/workflows/main.yml

      - name: Restaurar caché de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-playwright-1.63.0-chromium

      - name: Instalar dependencias
        run: |
          pip install python-dotenv python-telegram-bot playwright==1.63.0
          playwright install --with-deps chromium

      - name: Ejecutar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          python -u amazon_monitor.py

      - name: Guardar memoria del monitor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add estado_productos.json productos_nuevos_vistos.json estado_productos_nuevos.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar memoria del monitor"
            git push
          fi
```
